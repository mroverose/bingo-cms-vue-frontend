name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Prepare deploy directory (make writable)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          passphrase: ${{ secrets.ECS_PHRASE }}
          script: |
            sudo mkdir -p ${{ secrets.ECS_DEPLOY_PATH }}
            sudo chown -R ${{ secrets.ECS_USER }}:${{ secrets.ECS_USER }} ${{ secrets.ECS_DEPLOY_PATH }}
            sudo chmod -R 755 ${{ secrets.ECS_DEPLOY_PATH }}

      - name: Upload build artifacts to ECS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          passphrase: ${{ secrets.ECS_PHRASE }}
          source: "dist/"
          target: ${{ secrets.ECS_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Fix permissions and reload Nginx on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          passphrase: ${{ secrets.ECS_PHRASE }}
          script: |
            sudo chown -R nginx:nginx ${{ secrets.ECS_DEPLOY_PATH }}
            sudo find ${{ secrets.ECS_DEPLOY_PATH }} -type d -exec chmod 755 {} \;
            sudo find ${{ secrets.ECS_DEPLOY_PATH }} -type f -exec chmod 644 {} \;
            sudo nginx -t && sudo systemctl reload nginx
